services:
  db:
    image: postgres:14
    env_file: .env
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - group-project:/var/lib/postgresql/data
      - ./ProjectSourceCode/src/init_data:/docker-entrypoint-initdb.d
  web-init:
    image: node:lts
    working_dir: /repository
    volumes:
      - ./:/repository
      - app-node-modules:/repository/node_modules
    command: ['chown', '-R', 'node:node', '/repository/node_modules']
  web:
    image: node:lts
    user: 'node'
    working_dir: /repository/ProjectSourceCode/src
    env_file: .env
    environment:
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      web-init:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    volumes:
      - ./:/repository
      - app-node-modules:/repository/node_modules
    command:
      [
        'sh',
        '-c',
        'npm ci --workspace=scramble --include-workspace-root=false && node migrateStudy.js && npm --workspace=scramble start',
      ]
volumes:
  group-project:
  app-node-modules:
